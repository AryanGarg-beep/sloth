[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sloth"
version = "0.1.0"
description = "A lazy, local file organizer: reads your college files and sorts them by subject and unit using Gemma via Ollama."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "AryanGarg-beep" }]
# Standard library only. The heavy lifting is done by system tools:
# ollama, poppler (pdftotext/pdftoppm), tesseract, and optionally libreoffice.
dependencies = []

[project.scripts]
sloth = "sloth.cli:main"

[tool.setuptools.packages.find]
include = ["sloth*"]

[tool.setuptools.package-data]
sloth = ["static/*"]
